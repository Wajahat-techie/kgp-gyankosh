name: Keep Streamlit App Awake

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every hour at minute 0 (24 times a day)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          echo "Pinging Streamlit app to prevent sleep..."
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://kgp-gyankosh.streamlit.app" > /dev/null
          curl -s -L "https://kgp-gyankosh.streamlit.app/_stcore/health" || true
          echo "Ping completed successfully."
